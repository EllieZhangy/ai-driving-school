name: Deploy mobile web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify game behavior
        run: |
          node --check game.js
          node --check voice-recognition.js
          node --check voice-audio-worklet.js
          node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Package browser files only
        run: |
          mkdir -p _site
          cp index.html game.js styles.css voice-recognition.js voice-audio-worklet.js ai-driving-school.html product-demo.html _site/
          cp -R media _site/
          cp -R vendor models _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
